services:
  db:
    image: postgres:16
    container_name: fraud-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      # Named volume: the database survives container restarts
      - pgdata:/var/lib/postgresql/data
      # Raw CSVs are visible inside the container for COPY
      - ./data/raw:/data/raw:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
